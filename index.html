<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
        <div class="main-div">
        <h1 class="main-heading">Apex Trust Bank </h1>
        <div class="child-div">
            <p class="p1">Available Balance</p>
            <p class="p2">$2,450.00</p>
            <p class="p3">Enter an amount to begin</p>
        </div>
        <label for="input">Amount</label>
        <input type="number" name="" id="input" placeholder="0.00"> <br>
        <button class="btn deposite" onclick="deposite()">Deposite</button>
        <button class="btn balance" onclick="balance()">Check Balance</button> <br>
        <button class="btn withdraw" onclick="withdraw()">Withdraw</button>
        <button class="btn clear" onclick="clearData()">Clear</button>
        <div id="output"></div>
    </div>
    
    <script src="script.js"></script>
</body>

</html>
